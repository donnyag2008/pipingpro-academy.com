<!DOCTYPE html>
<html>
<head>
<style>
.card{
  width:200px;height:200px;background:#eee;
  cursor:pointer;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.overlay{
  position:absolute;inset:0;
  background:rgba(0,0,0,0.3);
  pointer-events:none;
  display:flex;align-items:center;justify-content:center;
}
.btn{
  background:#ccc;padding:10px;
  pointer-events:none;
}
</style>
</head>
<body>
<p>Click the card:</p>
<div class="card" onclick="alert('CARD CLICKED - it works!')">
  <div class="overlay">🔒</div>
  <div class="btn">Pro Required</div>
</div>

<p style="margin-top:20px">Click this plain button:</p>
<button onclick="alert('button works')">Plain button</button>
</body>
</html>

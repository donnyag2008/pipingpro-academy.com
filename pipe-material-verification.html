<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipe Material Suitability Verification — AI Tool | PipingPro Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #faf6ef; --paper: #f3ede2; --paper-dark: #e8dfd0;
      --ink: #1a1510; --ink-light: #4a3f30;
      --gold: #b8860b; --gold-bright: #d4a017; --gold-pale: #f5e9c8;
      --rust: #8b3a1a; --rule: #c8b89a;
      --green: #1a6b3a; --green-bg: #e0f2e9;
      --red: #b91c1c; --red-bg: #fde8e8;
      --amber: #92600a; --amber-bg: #fef3cd;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--cream);
      color: var(--ink); line-height: 1.7; overflow-x: hidden;
    }

    /* ── HEADER BAR ── */
    .tool-header {
      background: var(--ink); padding: 1.2rem 5%; border-bottom: 2px solid var(--gold);
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.8rem;
    }
    .tool-header-left { display: flex; align-items: center; gap: 1rem; }
    .back-link {
      font-size: 0.78rem; font-weight: 600; color: var(--gold-bright);
      text-decoration: none; letter-spacing: 0.04em; text-transform: uppercase;
    }
    .back-link:hover { color: #fff; }
    .tool-title {
      font-family: 'DM Serif Display', serif; font-size: 1.15rem; color: #fff;
    }
    .tool-badge {
      font-size: 0.62rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
      background: rgba(184,134,11,0.2); color: var(--gold-bright); border: 1px solid var(--gold);
      padding: 0.2rem 0.6rem; border-radius: 20px;
    }

    /* ── MAIN LAYOUT ── */
    .tool-container { max-width: 960px; margin: 0 auto; padding: 2.5rem 5% 4rem; }

    /* ── MODE TABS ── */
    .mode-tabs {
      display: flex; gap: 0; margin-bottom: 2rem; border-radius: 6px; overflow: hidden;
      border: 2px solid var(--paper-dark);
    }
    .mode-tab {
      flex: 1; padding: 1rem; text-align: center; cursor: pointer;
      font-size: 0.88rem; font-weight: 700; letter-spacing: 0.03em;
      background: var(--paper); color: var(--ink-light); border: none;
      font-family: 'DM Sans', sans-serif; transition: background 0.2s, color 0.2s;
    }
    .mode-tab.active { background: var(--ink); color: #fff; }
    .mode-tab:hover:not(.active) { background: var(--paper-dark); }
    .mode-tab-sub {
      display: block; font-size: 0.72rem; font-weight: 400; margin-top: 0.2rem; opacity: 0.7;
    }

    /* ── PANELS ── */
    .mode-panel { display: none; }
    .mode-panel.active { display: block; }

    /* ── FORM STYLES ── */
    .form-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem 2rem;
    }
    .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .form-group.full-width { grid-column: 1 / -1; }
    .form-label {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--ink-light);
    }
    .form-input, .form-select {
      padding: 0.65rem 0.8rem; border: 1px solid var(--paper-dark); border-radius: 4px;
      font-family: 'DM Sans', sans-serif; font-size: 0.92rem; color: var(--ink);
      background: #fff; outline: none; transition: border-color 0.2s;
    }
    .form-input:focus, .form-select:focus { border-color: var(--gold); }
    .form-select { appearance: auto; }
    .form-hint { font-size: 0.72rem; color: var(--ink-light); font-style: italic; }

    .btn-run {
      margin-top: 1.5rem; padding: 0.85rem 2.5rem; background: var(--gold);
      color: var(--ink); font-weight: 800; font-size: 0.92rem; letter-spacing: 0.05em;
      text-transform: uppercase; border: none; border-radius: 4px; cursor: pointer;
      font-family: 'DM Sans', sans-serif; transition: background 0.2s, transform 0.15s;
    }
    .btn-run:hover { background: var(--gold-bright); transform: translateY(-1px); }

    /* ── RESULTS ── */
    .results-area { margin-top: 2.5rem; }
    .results-title {
      font-family: 'DM Serif Display', serif; font-size: 1.4rem; color: var(--ink);
      margin-bottom: 1.5rem; padding-bottom: 0.8rem; border-bottom: 2px solid var(--gold);
    }

    /* Verdict banner */
    .verdict {
      padding: 1.2rem 1.5rem; border-radius: 6px; margin-bottom: 1.5rem;
      display: flex; align-items: flex-start; gap: 1rem;
    }
    .verdict-icon { font-size: 1.6rem; flex-shrink: 0; margin-top: 0.1rem; }
    .verdict-text { flex: 1; }
    .verdict-headline {
      font-family: 'DM Serif Display', serif; font-size: 1.15rem; margin-bottom: 0.3rem;
    }
    .verdict-detail { font-size: 0.88rem; line-height: 1.6; }
    .verdict-pass { background: var(--green-bg); border: 1px solid #a3d9b1; }
    .verdict-pass .verdict-headline { color: var(--green); }
    .verdict-fail { background: var(--red-bg); border: 1px solid #f5a3a3; }
    .verdict-fail .verdict-headline { color: var(--red); }
    .verdict-warn { background: var(--amber-bg); border: 1px solid #e0c97a; }
    .verdict-warn .verdict-headline { color: var(--amber); }

    /* Check rows */
    .check-list { display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 2rem; }
    .check-row {
      background: #fff; border: 1px solid var(--paper-dark); border-radius: 6px;
      padding: 1rem 1.2rem; display: flex; align-items: flex-start; gap: 0.8rem;
    }
    .check-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 0.15rem; }
    .check-body { flex: 1; }
    .check-title { font-weight: 700; font-size: 0.88rem; margin-bottom: 0.2rem; }
    .check-detail { font-size: 0.82rem; color: var(--ink-light); line-height: 1.6; }
    .check-clause {
      display: inline-block; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; background: var(--gold-pale); color: var(--gold);
      padding: 0.15rem 0.4rem; border-radius: 3px; margin-top: 0.4rem;
    }

    /* Material cards */
    .material-card {
      background: #fff; border: 2px solid var(--paper-dark); border-radius: 8px;
      padding: 1.4rem 1.5rem; margin-bottom: 1rem;
      transition: border-color 0.2s;
    }
    .material-card.recommended { border-color: var(--green); }
    .material-card.acceptable { border-color: var(--gold); }
    .material-card.not-suitable { border-color: var(--red); opacity: 0.7; }
    .mat-header { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.8rem; }
    .mat-rank {
      width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 0.75rem; font-weight: 800; flex-shrink: 0;
    }
    .recommended .mat-rank { background: var(--green-bg); color: var(--green); }
    .acceptable .mat-rank { background: var(--gold-pale); color: var(--gold); }
    .not-suitable .mat-rank { background: var(--red-bg); color: var(--red); }
    .mat-name {
      font-family: 'DM Serif Display', serif; font-size: 1.1rem; color: var(--ink);
    }
    .mat-tag {
      font-size: 0.62rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 0.2rem 0.5rem; border-radius: 12px; margin-left: auto;
    }
    .recommended .mat-tag { background: var(--green-bg); color: var(--green); }
    .acceptable .mat-tag { background: var(--gold-pale); color: var(--gold); }
    .not-suitable .mat-tag { background: var(--red-bg); color: var(--red); }
    .mat-props {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.5rem; margin-bottom: 0.8rem;
    }
    .mat-prop {
      font-size: 0.78rem; color: var(--ink-light);
    }
    .mat-prop strong { color: var(--ink); font-weight: 700; }
    .mat-reasoning {
      font-size: 0.82rem; color: var(--ink-light); line-height: 1.65;
      padding-top: 0.6rem; border-top: 1px solid var(--paper-dark);
    }

    /* Expandable card details */
    .mat-details {
      max-height: 0; overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.25s ease;
      opacity: 0;
    }
    .material-card.expanded .mat-details {
      max-height: 600px; opacity: 1;
    }
    .mat-toggle {
      display: flex; align-items: center; justify-content: center;
      gap: 0.4rem; width: 100%; padding: 0.5rem 0 0.1rem;
      background: none; border: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-size: 0.75rem;
      font-weight: 600; color: var(--gold); letter-spacing: 0.04em;
      transition: color 0.2s;
    }
    .mat-toggle:hover { color: var(--ink); }
    .mat-toggle-icon {
      display: inline-block; transition: transform 0.3s ease;
      font-size: 0.65rem;
    }
    .material-card.expanded .mat-toggle-icon { transform: rotate(180deg); }
    .mat-header { cursor: pointer; }
    .mat-calc-link {
      display: inline-block; margin-top: 0.8rem; padding: 0.45rem 1rem;
      font-size: 0.78rem; font-weight: 700; letter-spacing: 0.03em;
      color: var(--gold); background: var(--gold-pale);
      border: 1px solid var(--gold); border-radius: 4px;
      text-decoration: none; transition: background 0.2s, color 0.2s;
    }
    .mat-calc-link:hover { background: var(--gold); color: #fff; }

    /* PDF button */
    .btn-pdf {
      margin-top: 1.5rem; padding: 0.7rem 2rem; background: var(--ink);
      color: #fff; font-weight: 700; font-size: 0.82rem; letter-spacing: 0.05em;
      text-transform: uppercase; border: none; border-radius: 4px; cursor: pointer;
      font-family: 'DM Sans', sans-serif; transition: background 0.2s;
    }
    .btn-pdf:hover { background: #2a2520; }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .tool-header { padding: 1rem 4%; }
      .tool-container { padding: 1.5rem 4% 3rem; }
      .mat-props { grid-template-columns: 1fr 1fr; }
    }
      /* ── MDMT SIGN TOGGLE ── */
    .mdmt-row { display: flex; align-items: center; gap: 6px; }
    .mdmt-row .form-input { flex: 1; }
    .sign-toggle {
      width: 44px; height: 42px; font-size: 1.1rem; font-weight: 700;
      border: 2px solid var(--gold); border-radius: 4px;
      background: #fff; color: var(--ink); cursor: pointer; flex-shrink: 0;
      font-family: 'DM Sans', sans-serif; transition: background 0.2s, color 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .sign-toggle.negative { background: var(--gold); color: #fff; }

    /* ── UNIT TOGGLE ── */
    .unit-toggle {
      display: flex; border: 1px solid var(--gold); border-radius: 4px; overflow: hidden;
      font-family: 'DM Sans', sans-serif; flex-shrink: 0;
    }
    .unit-btn {
      padding: 0.3rem 0.7rem; font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.06em; border: none; cursor: pointer;
      background: transparent; color: var(--gold-bright);
      transition: background 0.2s, color 0.2s;
    }
    .unit-btn.active { background: var(--gold); color: #fff; }
  </style>
  <!-- Shared PPA material library (single source of truth) -->
  <script src="https://pipingpro-academy.com/ppa-materials.js"></script>
</head>

<script>
// ════════════════════════════════════════════════════════════════
//  UNIT SYSTEM — SI (default) / US Customary toggle
// ════════════════════════════════════════════════════════════════
let UNIT = 'SI'; // 'SI' or 'US'

const U = {
  SI: { p:'barg', t:'°C', s:'MPa', l:'mm' },
  US: { p:'psig', t:'°F',  s:'ksi',  l:'in.' }
};

function setUnits(u) {
  const prev = UNIT;
  UNIT = u;
  document.getElementById('btn-si').classList.toggle('active', u === 'SI');
  document.getElementById('btn-us').classList.toggle('active', u === 'US');

  // Update all unit labels
  document.querySelectorAll('.u-p').forEach(el => el.textContent = U[u].p);
  document.querySelectorAll('.u-t').forEach(el => el.textContent = U[u].t);
  document.querySelectorAll('.u-l').forEach(el => el.textContent = U[u].l);

  // Convert existing input values
  if (prev !== u) {
    convertField('f-dp',   prev, u, 'p');
    convertField('f-dt',   prev, u, 't');
    convertField('f-mdmt', prev, u, 't_abs');
    convertField('v-dp',   prev, u, 'p');
    convertField('v-dt',   prev, u, 't');
    convertField('v-mdmt', prev, u, 't_abs');
    convertField('v-ca',   prev, u, 'l');
  }

  // Clear results so stale unit displays don't persist
  document.getElementById('results-find').innerHTML = '';
  document.getElementById('results-verify').innerHTML = '';
}

function convertField(id, from, to, type) {
  const el = document.getElementById(id);
  if (!el || el.value === '') return;
  let v = parseFloat(el.value);
  if (isNaN(v)) return;

  if (type === 'p') {
    // barg ↔ psig: 1 barg = 14.5038 psig
    v = (from === 'SI') ? +(v * 14.5038).toFixed(1) : +(v / 14.5038).toFixed(1);
  } else if (type === 't') {
    // °C ↔ °F (signed value in field)
    v = (from === 'SI') ? Math.round(v * 9/5 + 32) : Math.round((v - 32) * 5/9);
  } else if (type === 't_abs') {
    // MDMT field stores absolute value; sign is in toggle button
    // Convert magnitude only: |°C| ↔ |°F delta from 32|
    // Actually need to reconstruct signed value, convert, then split
    const signBtn = document.getElementById(id + '-sign');
    const isNeg = signBtn && signBtn.classList.contains('negative');
    let signed = isNeg ? -v : v;
    signed = (from === 'SI') ? (signed * 9/5 + 32) : ((signed - 32) * 5/9);
    signed = Math.round(signed);
    if (signed < 0) {
      el.value = Math.abs(signed);
      if (signBtn && !isNeg) signBtn.classList.add('negative');
      if (signBtn) signBtn.textContent = '−';
    } else {
      el.value = signed;
      if (signBtn && isNeg) signBtn.classList.remove('negative');
      if (signBtn) signBtn.textContent = '+';
    }
    return;
  } else if (type === 'l') {
    // mm ↔ in.
    v = (from === 'SI') ? +(v / 25.4).toFixed(3) : +(v * 25.4).toFixed(1);
  }
  el.value = v;
}

// Helper: get input value converted to SI for internal calculations
function toSI_P(val) { return UNIT === 'US' ? val / 14.5038 : val; }       // → barg
function toSI_T(val) { return UNIT === 'US' ? (val - 32) * 5/9 : val; }    // → °C
function toSI_L(val) { return UNIT === 'US' ? val * 25.4 : val; }          // → mm

// Helper: format output values for display
function fmtP(barg) { return UNIT === 'US' ? (barg * 14.5038).toFixed(0) + ' psig' : barg.toFixed(0) + ' barg'; }
function fmtT(c)    { return UNIT === 'US' ? Math.round(c * 9/5 + 32) + '°F' : Math.round(c) + '°C'; }
function fmtS(mpa)  { return UNIT === 'US' ? (mpa / 6.895).toFixed(1) + ' ksi' : mpa.toFixed(1) + ' MPa'; }
function fmtL(mm)   { return UNIT === 'US' ? (mm / 25.4).toFixed(3) + ' in.' : mm.toFixed(2) + ' mm'; }
function fmtSv(mpa) { return UNIT === 'US' ? (mpa / 6.895).toFixed(1) : mpa.toFixed(1); } // value only
function uS()       { return UNIT === 'US' ? 'ksi' : 'MPa'; }
function uT()       { return UNIT === 'US' ? '°F' : '°C'; }
function uL()       { return UNIT === 'US' ? 'in.' : 'mm'; }

function getPPAMat(key) {
  if (PPA.MATERIALS[key]) return PPA.MATERIALS[key];
  if (INLINE_MATS[key])  return INLINE_MATS[key];
  return null;
}

function getMatName(key) {
  if (CLAD_MATS[key]) return CLAD_MATS[key].name;
  const m = getPPAMat(key);
  return m ? m.name : key;
}
function getShortName(key) {
  if (CLAD_MATS[key]) return CLAD_MATS[key].shortName;
  const m = getPPAMat(key);
  return m ? (m.grade ? m.spec + ' ' + m.grade : m.name) : key;
}
function getSuit(key) {
  if (CLAD_MATS[key]) return CLAD_MATS[key];
  return SUIT[key] || {};
}
function isClad(key) { return !!CLAD_MATS[key]; }

/* ── Convert PPA US Customary data to SI for display ── */
function getAllowableStress(key, tempC) {
  // For clad, use backing material stress
  const effKey = CLAD_MATS[key] ? CLAD_MATS[key].backing : key;
  const m = getPPAMat(effKey);
  if (!m) return null;
  const tempF = PPA.convert.c2f(tempC);
  const maxF = m.t[m.t.length - 1];
  if (tempF > maxF) return null;
  const r = PPA.interp(m.sh, m.t, tempF);
  return r.v * 6.895; // ksi → MPa
}

function getMaxTempC(key) {
  const effKey = CLAD_MATS[key] ? CLAD_MATS[key].backing : key;
  const m = getPPAMat(effKey);
  if (!m) return 0;
  return Math.round(PPA.convert.f2c(m.t[m.t.length - 1]));
}

function getSmtsMPa(key) {
  const effKey = CLAD_MATS[key] ? CLAD_MATS[key].backing : key;
  const m = getPPAMat(effKey);
  return m ? Math.round(m.smts * 6.895) : 0;
}
function getSmysMPa(key) {
  const effKey = CLAD_MATS[key] ? CLAD_MATS[key].backing : key;
  const m = getPPAMat(effKey);
  return m ? Math.round(m.smys * 6.895) : 0;
}

/* ── MDMT check — uses PPA.curveMDMT for curve-designated materials ── */
function getMinTempC(key, thickness_mm) {
  const effKey = CLAD_MATS[key] ? CLAD_MATS[key].backing : key;
  const m = getPPAMat(effKey);
  if (!m) return -29;
  const tmin = m.tmin;
  if (typeof tmin === 'string' && /^[A-D]$/.test(tmin)) {
    // Curve-designated — thickness-dependent MDMT
    const t_mm = thickness_mm || 10; // default 10mm if unknown
    const result = PPA.curveMDMT(tmin, t_mm);
    return result ? result.mdmt_C : -29;
  }
  // Numeric tmin in °F → convert to °C
  return Math.round(PPA.convert.f2c(tmin));
}

function getMDMTInfo(key, thickness_mm) {
  const effKey = CLAD_MATS[key] ? CLAD_MATS[key].backing : key;
  const m = getPPAMat(effKey);
  if (!m) return { mdmt_C: -29, isCurve: false, curve: null };
  const tmin = m.tmin;
  if (typeof tmin === 'string' && /^[A-D]$/.test(tmin)) {
    const t_mm = thickness_mm || 10;
    const result = PPA.curveMDMT(tmin, t_mm);
    return { mdmt_C: result ? result.mdmt_C : -29, isCurve: true, curve: tmin, thickness: t_mm, clamp: result ? result.clamp : null };
  }
  return { mdmt_C: Math.round(PPA.convert.f2c(tmin)), isCurve: false, curve: null };
}

/* ── +/− sign toggle for MDMT input ── */
function toggleSign(btnId) {
  const btn = document.getElementById(btnId);
  const isNeg = btn.classList.toggle('negative');
  btn.textContent = isNeg ? '−' : '+';
}
function getMDMTValue(prefix) {
  const raw = parseFloat(document.getElementById(prefix + '-mdmt').value);
  if (isNaN(raw)) return null;
  const isNeg = document.getElementById(prefix + '-mdmt-sign').classList.contains('negative');
  const signed = isNeg ? -raw : raw;
  return UNIT === 'US' ? (signed - 32) * 5/9 : signed; // always return °C
}

      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = getMatName(key);
      og.appendChild(opt);
    });
    sel.appendChild(og);
  });
}

function calcMinWall(dp_barg, od_mm, S_mpa, E, ca_mm) {
  const P = dp_barg * 0.1; // barg to MPa
  const Y = 0.4; // B31.3 coefficient for t < D/6
  const W = 1.0; // weld strength reduction factor
  const tm = (P * od_mm) / (2 * (S_mpa * E * W + P * Y));
  return tm + ca_mm; // add corrosion allowance
}

function getFluidWarnings(matKey, fluid) {
  const suit = getSuit(matKey);
  const tp = suit.type || '';
  const warnings = [];
  if (fluid === 'caustic' && tp.includes('Carbon Steel')) {
    warnings.push('Carbon steel in caustic service requires PWHT to prevent caustic SCC (NACE SP0403). Max temperature ~93°C without special precautions.');
  }
  if (fluid === 'amine' && tp.includes('Carbon Steel')) {
    warnings.push('Carbon steel in amine service requires PWHT per API RP 945 to prevent amine SCC.');
  }
  if (fluid === 'hydrogen' && tp.includes('Carbon Steel')) {
    warnings.push('Check Nelson Curve (API RP 941) for hydrogen attack resistance at service temperature and hydrogen partial pressure.');
  }
  if (fluid === 'sulfuric' && tp.includes('Carbon Steel')) {
    warnings.push('Carbon steel is only suitable for sulfuric acid above 93% concentration at velocities below 0.9 m/s per NACE 5A151.');
  }
  if (fluid === 'seawater' && (matKey.includes('304') || matKey.includes('TP304'))) {
    warnings.push('TP304/304L susceptible to chloride pitting and SCC in seawater. TP316L, duplex, or nickel alloys are preferred.');
  }
  if (fluid === 'oxygen' && tp.includes('Carbon Steel')) {
    warnings.push('Carbon steel for oxygen service requires thorough cleaning per CGA G-4.1 and velocity limits. Stainless steel or Monel preferred for high-pressure oxygen.');
  }
  if (fluid === 'co2' && tp.includes('Carbon Steel')) {
    warnings.push('Carbon steel in wet CO₂ service subject to mesa corrosion. Corrosion rate depends on partial pressure, temperature, and pH. Consider corrosion-resistant alloy or inhibition.');
  }
  return warnings;
}

function getServiceWarnings(matKey, service) {
  const suit = getSuit(matKey);
  const warnings = [];
  if (service === 'sour' && !suit.naceSuitable) {
    warnings.push('NOT SUITABLE for sour service — does not meet NACE MR0175/ISO 15156 requirements.');
  } else if (service === 'sour' && suit.naceSuitable) {
    warnings.push(suit.naceNote);
  }
  if (service === 'cyclic') {
    warnings.push('Severe cyclic service per B31.3 §300.2 — fatigue analysis required. Stress range reduction factors (f) apply per Table 302.3.5.');
  }
  if (service === 'cat-m') {
    warnings.push('Category M service — toxic fluid. Additional examination, testing, and material requirements per B31.3 Chapter VIII.');
  }
  return warnings;
}

//  MODE SWITCHING
// ════════════════════════════════════════════════════════════════
function setMode(mode) {
  document.getElementById('tab-find').classList.toggle('active', mode === 'find');
  document.getElementById('tab-verify').classList.toggle('active', mode === 'verify');
  document.getElementById('panel-find').classList.toggle('active', mode === 'find');
  document.getElementById('panel-verify').classList.toggle('active', mode === 'verify');
}

// ════════════════════════════════════════════════════════════════
//  MODE 1: FIND SUITABLE MATERIALS
// ════════════════════════════════════════════════════════════════
function runFind() {
  const dp_raw = parseFloat(document.getElementById('f-dp').value);
  const dt_raw = parseFloat(document.getElementById('f-dt').value);
  if (isNaN(dp_raw) || isNaN(dt_raw)) { alert('Please enter Design Pressure and Design Temperature.'); return; }
  const dp = toSI_P(dp_raw);  // barg
  const dt = toSI_T(dt_raw);  // °C
  const mdmt = getMDMTValue('f'); // °C or null
  const nps = document.getElementById('f-nps').value;

  const results = [];

  // Iterate curated material list
  const allKeys = CALC_MAT_ORDER.flatMap(g => g.keys);
  for (const key of allKeys) {
    const suit = getSuit(key);
    const S = getAllowableStress(key, dt);
    const maxTemp = getMaxTempC(key);
    const minTemp = getMinTempC(key); // default thickness for find mode
    const tempOk = dt <= maxTemp;
    const mdmtOk = mdmt === null || mdmt >= minTemp;
    const suitability = { key, S, tempOk, mdmtOk, issues: [], strengths: [], score: 0 };

    if (!tempOk) {
      suitability.issues.push(`Max temperature ${fmtT(maxTemp)} exceeded (DT = ${fmtT(dt)})`);
      suitability.score -= 100;
    }
    if (!mdmtOk) {
      suitability.issues.push(`Min temperature ${fmtT(minTemp)} exceeded (MDMT = ${fmtT(mdmt)})`);
      suitability.score -= 100;
    }
    if (S === null) {
      suitability.issues.push('No allowable stress data at this temperature');
      suitability.score -= 100;
    }

    // Service checks
    if (service === 'sour' && !suit.naceSuitable) {
      suitability.issues.push('Not suitable for sour service per NACE MR0175');
      suitability.score -= 100;
    } else if (service === 'sour' && suit.naceSuitable) {
      suitability.strengths.push(suit.naceNote);
      suitability.score += 10;
    }

    if (suit.avoid && suit.avoid.includes(fluid)) {
      suitability.issues.push(`Generally avoided for ${fluid} service`);
      suitability.score -= 50;
    }
    if (suit.preferFor && suit.preferFor.includes(fluid)) {
      suitability.strengths.push(`Commonly specified for ${fluid} service`);
      suitability.score += 15;
    }
    if (suit.preferFor && suit.preferFor.includes(service)) {
      suitability.score += 10;
    }

    // Wall thickness check if NPS provided
    const clad = isClad(key);
    if (nps && PIPE_DATA[nps] && S > 0) {
      const od = PIPE_DATA[nps].od;
      const caVal = clad ? 0 : 3.0;
      const tReq = calcMinWall(dp, od, S, 1.0, caVal);
      suitability.tReq = tReq;
      suitability.od = od;
      if (clad) suitability.strengths.push('CA = 0 ${uL()} (CRA liner provides corrosion barrier)');
      const schData = PIPE_DATA[nps].sch;
      const validSchedules = Object.entries(schData).filter(([s,t]) => t >= tReq);
      if (validSchedules.length > 0) {
        suitability.minSch = validSchedules[0][0];
        suitability.strengths.push(`Available from Sch ${validSchedules[0][0]} (t_req = ${fmtL(tReq)})`);
      } else {
        suitability.issues.push(`No standard schedule has sufficient wall (t_req = ${fmtL(tReq)})`);
        suitability.score -= 30;
      }
    }

    // Cost scoring
    const tp = suit.type || '';
    if (tp.includes('Carbon Steel')) suitability.score += 20;
    else if (tp.startsWith('Low Alloy')) suitability.score += 10;
    else if (clad) suitability.score += 5;
    else if (tp.includes('Duplex')) suitability.score += 0;
    else if (tp.includes('Austenitic')) suitability.score += 5;
    else suitability.score -= 10;

    if (S > 0 && tempOk) suitability.score += 20;

    results.push(suitability);
  }

  // Sort by score descending
  results.sort((a, b) => b.score - a.score);

  // Render results
  const container = document.getElementById('results-find');
  let html = `<h3 class="results-title">Recommended Materials for ${fmtP(dp)} / ${fmtT(dt)}</h3>`;

  // Filter into categories
  const recommended = results.filter(r => r.score >= 20 && r.issues.length === 0);
  const acceptable = results.filter(r => r.score >= 0 && r.score < 20 && r.issues.filter(i => !i.includes('avoided')).length === 0);
  const notSuitable = results.filter(r => r.score < 0 || r.issues.some(i => i.includes('exceeded') || i.includes('Not suitable') || i.includes('No allowable')));

  // Show recommended
  recommended.forEach((r, i) => {
    html += renderMaterialCard(r, i + 1, 'recommended', 'Recommended');
  });

  // Show acceptable (max 3)
  acceptable.slice(0, 3).forEach((r, i) => {
    html += renderMaterialCard(r, recommended.length + i + 1, 'acceptable', 'Acceptable');
  });

  // Show a few not-suitable as comparison
  const showNotSuitable = notSuitable.filter(r =>
    (getSuit(r.key).type || '').includes('Carbon Steel') || r.score > -50
  ).slice(0, 2);
  showNotSuitable.forEach((r, i) => {
    html += renderMaterialCard(r, recommended.length + Math.min(acceptable.length, 3) + i + 1, 'not-suitable', 'Not Suitable');
  });

  if (recommended.length === 0 && acceptable.length === 0) {
    html += `<div class="verdict verdict-fail">
      <div class="verdict-icon">⚠</div>
      <div class="verdict-text">
        <div class="verdict-headline">No Standard Material Found</div>
        <div class="verdict-detail">The combination of ${dp} barg at ${dt}°C with ${service} service / ${fluid} fluid is extremely demanding. Consider specialist metallurgical consultation for exotic alloys or clad/lined construction.</div>
      </div>
    </div>`;
  }

  container.innerHTML = html;
}

function renderMaterialCard(r, rank, cls, label) {
  const suit = getSuit(r.key);
  const S = r.S ? fmtSv(r.S) : 'N/A';
  const maxTemp = getMaxTempC(r.key);
  const minTemp = getMinTempC(r.key);
  let reasoning = '';
  if (r.strengths.length) reasoning += r.strengths.map(s => '✓ ' + s).join('<br/>');
  if (r.issues.length) reasoning += (reasoning ? '<br/>' : '') + r.issues.map(s => '✗ ' + s).join('<br/>');
  reasoning += '<br/>' + (suit.notes || '');

  const fluidWarnings = getFluidWarnings(r.key, document.getElementById('f-fluid')?.value || document.getElementById('v-fluid')?.value || 'general');
  if (fluidWarnings.length) reasoning += '<br/><br/>' + fluidWarnings.map(w => '⚠ ' + w).join('<br/>');

  return `<div class="material-card ${cls}">
    <div class="mat-header" onclick="this.closest('.material-card').classList.toggle('expanded')">
      <div class="mat-rank">${rank}</div>
      <div class="mat-name">${getMatName(r.key)}</div>
      <span class="mat-tag">${label}</span>
    </div>
    <div class="mat-details">
      <div class="mat-props">
        <div class="mat-prop"><strong>Type:</strong> ${suit.type || ''}</div>
        <div class="mat-prop"><strong>S @ DT:</strong> ${S} ${uS()}</div>
        <div class="mat-prop"><strong>Temp Range:</strong> ${fmtT(minTemp)} to ${fmtT(maxTemp)}</div>
        <div class="mat-prop"><strong>SMTS:</strong> ${fmtS(getSmtsMPa(r.key))}</div>
        ${r.tReq ? `<div class="mat-prop"><strong>t_req:</strong> ${fmtL(r.tReq)}</div>` : ''}
        ${r.minSch ? `<div class="mat-prop"><strong>Min Sch:</strong> ${r.minSch}</div>` : ''}
      </div>
      <div class="mat-reasoning">${reasoning}</div>
      ${r.tReq ? `<a class="mat-calc-link" href="https://pipingpro-academy.com/pipe-wall-thickness-calculator" target="_blank">Run Full Wall Thickness Calculation →</a>` : ''}
    </div>
    <button class="mat-toggle" onclick="this.closest('.material-card').classList.toggle('expanded')">
      <span class="mat-toggle-label">Details</span>
      <span class="mat-toggle-icon">▼</span>
    </button>
  </div>`;
}

// ════════════════════════════════════════════════════════════════
//  MODE 2: VERIFY MATERIAL SELECTION
// ════════════════════════════════════════════════════════════════
function runVerify() {
  const matKey = document.getElementById('v-mat').value;
  const nps = document.getElementById('v-nps').value;
  const dp_raw = parseFloat(document.getElementById('v-dp').value);
  const dt_raw = parseFloat(document.getElementById('v-dt').value);
  if (!matKey || isNaN(dp_raw) || isNaN(dt_raw)) { alert('Please select a material and enter Design Pressure and Design Temperature.'); return; }
  const dp = toSI_P(dp_raw);  // barg
  const dt = toSI_T(dt_raw);  // °C
  const mdmt = getMDMTValue('v'); // °C or null
  const sch = document.getElementById('v-sch').value;
  const ca = toSI_L(parseFloat(document.getElementById('v-ca').value) || 0); // mm
  const E = parseFloat(document.getElementById('v-weld').value);
  const service = document.getElementById('v-service').value;
  const fluid = document.getElementById('v-fluid').value;

  const suit = getSuit(matKey);
  const shortName = getShortName(matKey);
  const maxTemp = getMaxTempC(matKey);
  const S = getAllowableStress(matKey, dt);
  const checks = [];
  let overallPass = true;
  let overallWarn = false;

  // Determine wall thickness for MDMT curve lookup
  let wallThick = null;
  if (nps && sch && PIPE_DATA[nps]) {
    const schData = PIPE_DATA[nps].sch;
    wallThick = schData[sch] || null;
  }

  // Clad pipe: override CA to 0 and add info check
  const clad = isClad(matKey);
  const effectiveCA = clad ? 0 : ca;
  if (clad) {
    const cm = CLAD_MATS[matKey];
    checks.push({
      pass: true, title: 'Clad Pipe Construction',
      detail: `Backing: ${getMatName(cm.backing)} (structural strength for pressure containment). Liner: ${getMatName(cm.liner)} (corrosion resistance). Corrosion allowance = 0 ${uL()} — CRA liner acts as corrosion barrier. Wall thickness based on backing material stress.`,
      clause: 'ASME B31.3 §305.2.3'
    });
  }

  // CHECK 1: Temperature range
  if (dt > maxTemp) {
    checks.push({
      pass: false, title: 'Design Temperature — FAIL',
      detail: `${shortName} is rated to ${fmtT(maxTemp)} maximum. Design temperature of ${fmtT(dt)} exceeds this limit.`,
      clause: 'ASME B31.3 Table A-1'
    });
    overallPass = false;
  } else if (dt > maxTemp - 30) {
    checks.push({
      pass: 'warn', title: 'Design Temperature — WARNING',
      detail: `${shortName} is rated to ${fmtT(maxTemp)}. Design temperature of ${fmtT(dt)} is within 30°C of the upper limit. Allowable stress drops significantly in this range.`,
      clause: 'ASME B31.3 Table A-1'
    });
    overallWarn = true;
  } else {
    checks.push({
      pass: true, title: 'Design Temperature — PASS',
      detail: `${shortName} is rated to ${fmtT(maxTemp)}. Design temperature of ${fmtT(dt)} is within range.`,
      clause: 'ASME B31.3 Table A-1'
    });
  }

  // CHECK 2: MDMT — now thickness-dependent for curve-designated materials
  if (mdmt !== null) {
    const mdmtInfo = getMDMTInfo(matKey, wallThick);
    const minTemp = mdmtInfo.mdmt_C;
    let mdmtDetail = '';
    if (mdmtInfo.isCurve) {
      const tLabel = wallThick ? `${wallThick.toFixed(1)} mm wall` : 'default 10 mm wall';
      mdmtDetail = `${shortName} has Curve ${mdmtInfo.curve} designation (Figure 323.2.2A). At ${tLabel}, allowable MDMT = ${fmtT(minTemp)}.`;
    } else {
      mdmtDetail = `${shortName} base MDMT is ${fmtT(minTemp)}.`;
    }

    if (mdmt < minTemp) {
      checks.push({
        pass: false, title: 'Minimum Design Metal Temperature — FAIL',
        detail: `${mdmtDetail} Required MDMT of ${fmtT(mdmt)} is below this — impact testing required per para. 323.2.2, or select a low-temperature grade.`,
        clause: 'ASME B31.3 §323.2.2'
      });
      overallPass = false;
    } else {
      checks.push({
        pass: true, title: 'Minimum Design Metal Temperature — PASS',
        detail: `${mdmtDetail} Required MDMT of ${fmtT(mdmt)} is within range.`,
        clause: 'ASME B31.3 §323.2.2'
      });
    }
  }

  // CHECK 3: Allowable stress
  if (S !== null) {
    checks.push({
      pass: true, title: `Allowable Stress at ${fmtT(dt)} — ${fmtS(S)}`,
      detail: `Interpolated from B31.3 Table A-1. SMTS = ${fmtS(getSmtsMPa(matKey))}, SMYS = ${fmtS(getSmysMPa(matKey))}.`,
      clause: 'ASME B31.3 Table A-1'
    });
  } else {
    checks.push({
      pass: false, title: 'Allowable Stress — NOT AVAILABLE',
      detail: `No allowable stress data for ${shortName} at ${fmtT(dt)}. Temperature likely exceeds material limit.`,
      clause: 'ASME B31.3 Table A-1'
    });
    overallPass = false;
  }

  // CHECK 4: Wall thickness
  if (nps && sch && S > 0 && PIPE_DATA[nps]) {
    const od = PIPE_DATA[nps].od;
    const tReq = calcMinWall(dp, od, S, E, effectiveCA);
    const schData = PIPE_DATA[nps].sch;
    const tAvail = schData[sch];
    const caLabel = clad ? `0 ${uL()} CA (CRA liner)` : `${fmtL(effectiveCA)} CA`;

    if (tAvail) {
      const ratio = (tReq / tAvail * 100).toFixed(1);
      if (tReq <= tAvail) {
        checks.push({
          pass: true, title: `Wall Thickness — PASS (${ratio}% utilisation)`,
          detail: `Required: ${fmtL(tReq)} (incl. ${caLabel}). Available: Sch ${sch} = ${fmtL(tAvail)} for NPS ${nps} (OD ${fmtL(od)}). Weld joint factor E = ${E}.`,
          clause: 'ASME B31.3 §304.1.2',
          link: 'https://pipingpro-academy.com/pipe-wall-thickness-calculator'
        });
      } else {
        checks.push({
          pass: false, title: `Wall Thickness — FAIL (${ratio}% utilisation)`,
          detail: `Required: ${fmtL(tReq)} (incl. ${caLabel}). Available: Sch ${sch} = ${fmtL(tAvail)}. Wall thickness is insufficient — increase schedule or reduce pressure.`,
          clause: 'ASME B31.3 §304.1.2',
          link: 'https://pipingpro-academy.com/pipe-wall-thickness-calculator'
        });
        overallPass = false;
      }
    } else {
      checks.push({
        pass: 'warn', title: 'Wall Thickness — Schedule Not Found',
        detail: `Schedule ${sch} is not standard for NPS ${nps}. Cannot verify wall thickness.`,
        clause: 'ASME B36.10M'
      });
      overallWarn = true;
    }
  }

  // CHECK 5: Service compatibility
  const svcWarnings = getServiceWarnings(matKey, service);
  svcWarnings.forEach(w => {
    const isFail = w.startsWith('NOT SUITABLE');
    if (isFail) overallPass = false;
    checks.push({
      pass: isFail ? false : 'warn',
      title: isFail ? 'Service Compatibility — FAIL' : 'Service Compatibility — Note',
      detail: w,
      clause: isFail ? 'NACE MR0175 / ISO 15156' : 'ASME B31.3 §300.2'
    });
    if (!isFail) overallWarn = true;
  });

  // CHECK 6: Fluid compatibility
  const fluidWarnings = getFluidWarnings(matKey, fluid);
  fluidWarnings.forEach(w => {
    checks.push({
      pass: 'warn', title: 'Fluid Compatibility — Warning',
      detail: w,
      clause: 'Industry Practice / NACE'
    });
    overallWarn = true;
  });

  // Build results
  const container = document.getElementById('results-verify');
  let html = `<h3 class="results-title">Verification: ${getMatName(matKey)}</h3>`;

  // Overall verdict
  if (overallPass && !overallWarn) {
    html += `<div class="verdict verdict-pass">
      <div class="verdict-icon">✓</div>
      <div class="verdict-text">
        <div class="verdict-headline">${shortName} is Fit for Purpose</div>
        <div class="verdict-detail">Material passes all checks for ${fmtP(dp)} at ${fmtT(dt)} in ${service.replace('-',' ')} service.</div>
      </div>
    </div>`;
  } else if (overallPass && overallWarn) {
    html += `<div class="verdict verdict-warn">
      <div class="verdict-icon">⚠</div>
      <div class="verdict-text">
        <div class="verdict-headline">${shortName} is Acceptable with Conditions</div>
        <div class="verdict-detail">Material passes primary checks but has warnings that require engineering review. See details below.</div>
      </div>
    </div>`;
  } else {
    html += `<div class="verdict verdict-fail">
      <div class="verdict-icon">✗</div>
      <div class="verdict-text">
        <div class="verdict-headline">${shortName} is NOT Fit for Purpose</div>
        <div class="verdict-detail">One or more checks have failed. See details below for specific failures and alternative recommendations.</div>
      </div>
    </div>`;
  }

  // Individual checks
  html += '<div class="check-list">';
  checks.forEach(c => {
    const icon = c.pass === true ? '✓' : c.pass === 'warn' ? '⚠' : '✗';
    const color = c.pass === true ? 'var(--green)' : c.pass === 'warn' ? 'var(--amber)' : 'var(--red)';
    html += `<div class="check-row">
      <div class="check-icon" style="color:${color}">${icon}</div>
      <div class="check-body">
        <div class="check-title">${c.title}</div>
        <div class="check-detail">${c.detail}</div>
        <span class="check-clause">${c.clause}</span>
        ${c.link ? `<a class="mat-calc-link" href="${c.link}" target="_blank">Full Wall Thickness Calculator →</a>` : ''}
      </div>
    </div>`;
  });
  html += '</div>';

  // If failed, suggest alternatives
  if (!overallPass) {
    html += '<h3 class="results-title" style="margin-top:2rem;">Recommended Alternatives</h3>';

    const alternatives = [];
    const allKeys = CALC_MAT_ORDER.flatMap(g => g.keys);
    for (const key of allKeys) {
      if (key === matKey) continue;
      const altSuit = getSuit(key);
      const altS = getAllowableStress(key, dt);
      const altMax = getMaxTempC(key);
      const altMin = getMinTempC(key);
      if (altS === null || dt > altMax) continue;
      if (mdmt !== null && mdmt < altMin) continue;
      if (service === 'sour' && !altSuit.naceSuitable) continue;
      if (altSuit.avoid && altSuit.avoid.includes(fluid)) continue;

      let score = 0;
      const tp = altSuit.type || '';
      if (altSuit.preferFor && altSuit.preferFor.includes(fluid)) score += 15;
      if (altSuit.preferFor && altSuit.preferFor.includes(service)) score += 10;
      if (tp.includes('Carbon Steel')) score += 20;
      else if (tp.startsWith('Low Alloy')) score += 10;

      let tInfo = '';
      if (nps && PIPE_DATA[nps] && altS > 0) {
        const tReq = calcMinWall(dp, PIPE_DATA[nps].od, altS, 1.0, ca || 3);
        const schData = PIPE_DATA[nps].sch;
        const validSch = Object.entries(schData).filter(([s,t]) => t >= tReq);
        if (validSch.length > 0) { tInfo = `Available from Sch ${validSch[0][0]}`; score += 10; }
        else { score -= 20; }
      }

      alternatives.push({ key, S: altS, score, tInfo });
    }

    alternatives.sort((a, b) => b.score - a.score);
    alternatives.slice(0, 3).forEach((alt, i) => {
      const as = getSuit(alt.key);
      html += `<div class="material-card recommended">
        <div class="mat-header">
          <div class="mat-rank">${i + 1}</div>
          <div class="mat-name">${getMatName(alt.key)}</div>
          <span class="mat-tag" style="background:var(--green-bg);color:var(--green);">Alternative</span>
        </div>
        <div class="mat-props">
          <div class="mat-prop"><strong>Type:</strong> ${as.type || ''}</div>
          <div class="mat-prop"><strong>S @ ${fmtT(dt)}:</strong> ${fmtS(alt.S)}</div>
          <div class="mat-prop"><strong>Temp Range:</strong> ${fmtT(getMinTempC(alt.key))} to ${fmtT(getMaxTempC(alt.key))}</div>
          ${alt.tInfo ? `<div class="mat-prop"><strong>Wall:</strong> ${alt.tInfo}</div>` : ''}
        </div>
        <div class="mat-reasoning">${as.notes || ''}</div>
      </div>`;
    });
  }

  container.innerHTML = html;
}
</script>
